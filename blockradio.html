<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block SR200 MKII Advanced Remote</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #007aff;
            --danger-color: #ff3b30;
            --success-color: #34c759;
            --border-color: #3a3a3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .remote-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 340px;
            text-align: center;
        }
        h1 { font-size: 1.3rem; margin: 0 0 5px 0; }
        .subtitle { font-size: 0.85rem; color: #8e8e93; margin-bottom: 20px; }
        .section { margin-bottom: 18px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .grid-3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
        .playback-controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
        
        button {
            background-color: #3a3a3c;
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { background-color: #48484a; }
        button:active { transform: scale(0.97); }
        
        button.power-toggle { width: 100%; font-weight: bold; }
        button.power-on { background-color: var(--success-color); color: white; }
        button.power-off { background-color: var(--danger-color); color: white; }
        
        .vol-display { font-size: 1.2rem; font-weight: bold; min-width: 40px; text-align: center; }
        .vol-btn { background-color: var(--accent-color); font-size: 1.2rem; padding: 8px 0; }
        
        .info-box { 
            background-color: #1e1e1e; 
            padding: 15px; 
            border-radius: 12px; 
            font-size: 0.9rem; 
            color: #d1d1d6;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            word-break: break-word;
            line-height: 1.4;
        }
        .cover-art {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            margin-bottom: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: none;
        }
        .info-box .title { font-weight: bold; color: #ffffff; font-size: 1rem; }
        .info-box .artist { color: #007aff; font-weight: 500; margin-top: 2px; }
        .info-box .album { font-style: italic; color: #a1a1aa; font-size: 0.85rem; margin-top: 2px; }
        .info-box .detail { font-size: 0.8rem; color: #8e8e93; margin-top: 6px; border-top: 1px solid #2d2d2d; padding-top: 4px; width: 100%; display: none; }
        .refresh-btn { background-color: #3a3a3c; font-size: 0.85rem; padding: 6px 12px; width: auto; }
    </style>
</head>

<!-- Block 2 -->
<body>

<div class="remote-container">
    <h1>Block Audio</h1>
    <div class="subtitle">SR200 MKII Smart Control</div>

    <!-- 1. Power Toggle & Standby-Schutz Schalter -->
    <div class="section">
        <button id="btn-power" class="power-toggle power-off" onclick="togglePower()">Lade Status...</button>
        
        <div style="margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 0.9rem;">
            <input type="checkbox" id="chk-keepalive" checked style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-color);">
            <label for="chk-keepalive" style="cursor: pointer; user-select: none; color: #d1d1d6;">Automatisches Ausschalten blockieren</label>
        </div>
    </div>

    <!-- 2. Lautstärke mit Live-Anzeige und +/- -->
    <div class="section">
        <div style="margin-bottom: 8px; font-size: 0.85rem; color: #8e8e93;">Lautstärke</div>
        <div class="grid-3">
            <button class="vol-btn" onclick="changeVolume(-1)">−</button>
            <span id="txt-volume" class="vol-display">--</span>
            <button class="vol-btn" onclick="changeVolume(1)">+</button>
        </div>
    </div>

    <!-- 3. Playback Controls -->
    <div class="section">
        <div style="margin-bottom: 8px; font-size: 0.85rem; color: #8e8e93;">Wiedergabe</div>
        <div class="playback-controls">
            <button onclick="sendControl('netRemote.play.control', '4')" title="Zurück">⏮</button>
            <button onclick="playWithRestore()" title="Play">▶</button>
            <button onclick="sendControl('netRemote.play.control', '2')" title="Pause">⏸</button>
            <button onclick="sendControl('netRemote.play.control', '3')" title="Weiter">⏭</button>
        </div>
    </div>

    <!-- 4. DLNA Musik-Browser mit integriertem Suchfeld -->
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="font-size: 0.85rem; color: #8e8e93;">DLNA Medien-Browser</div>
            <div style="display: flex; gap: 6px;">
                <button onclick="resetDLNAHome()" style="font-size: 0.75rem; padding: 4px 8px; width: auto; background-color: #007aff;">🏠 Home</button>
                <button onclick="navigateDLNA('back')" style="font-size: 0.75rem; padding: 4px 8px; width: auto; background-color: #48484a;">⌫ Zurück</button>
            </div>
        </div>
        
        <!-- NEU: Das Echtzeit-Suchfeld -->
        <div style="margin-bottom: 10px; position: relative;">
            <input type="text" id="input-dlna-search" oninput="filterDLNAList()" placeholder="Titel filtern... (z.B. Alan)" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3a3a3c; background: #1e1e1e; color: white; font-size: 0.9rem; box-sizing: border-box;">
        </div>

        <div id="dlna-browser-list" style="background-color: #1e1e1e; border-radius: 10px; max-height: 180px; overflow-y: auto; padding: 5px; text-align: left;">
            <div style="font-size: 0.8rem; color: #8e8e93; text-align: center; padding: 10px;">Lade Musik-Verzeichnis...</div>
        </div>
    </div>

    <!-- 5. Aktuelle Information -->
    <div class="section">
        <div style="margin-bottom: 8px; font-size: 0.85rem; color: #8e8e93;">Aktuelle Information</div>
        <div id="box-nowplaying" class="info-box">
            <img id="info-cover" class="cover-art" src="" alt="Album Cover">
            <div id="info-tracknumber" style="font-size: 0.8rem; font-weight: bold; color: var(--accent-color); margin-bottom: 4px; display: none;"></div>
            <div id="info-title" class="title">Keine Daten geladen</div>
            <div id="info-artist" class="artist"></div>
            <div id="info-album" class="album"></div>
            <div id="info-detail" class="detail"></div>
        </div>
    </div>
</div>

<!-- Block 3a: Konfiguration & Initialisierung (Mit dynamischem FriendlyName) -->
<script>
    const radioIP = "192.168.192.82"; 
    const pin = "1234";
    
    let currentPowerState = 0; 
    let currentVolume = 0;
    let globalTotalTracks = 0; 

    function getFSAPIValue(xmlString) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        const c8Element = xmlDoc.querySelector("value c8_array");
        if (c8Element) return c8Element.textContent;
        const valueElement = xmlDoc.querySelector("value");
        return valueElement ? valueElement.textContent : null;
    }

    async function fetchFSAPI(path) {
        try {
            let response = await fetch(`http://${radioIP}/fsapi/GET/${path}?pin=${pin}`);
            let text = await response.text();
            return getFSAPIValue(text);
        } catch (e) { return null; }
    }

    async function setFSAPI(path, value) {
        try {
            let response = await fetch(`http://${radioIP}/fsapi/SET/${path}?pin=${pin}&value=${value}`);
            return response.ok;
        } catch (e) { return false; }
    }

    // Status beim Start laden (Jetzt mit dynamischem FriendlyName Abruf)
    async function initStatus() {
        try {
            // 1. Hole den im Radio konfigurierten Wunschnamen ab
            let friendlyName = await fetchFSAPI('netRemote.sys.info.friendlyName');
            if (friendlyName && friendlyName.trim() !== "") {
                // Überschreibt das statische "Block Audio" in der H1-Überschrift deiner radio.html
                const h1Element = document.querySelector('h1');
                if (h1Element) h1Element.innerText = friendlyName.trim();
            }

            // 2. Normalen Power- und Lautstärke-Status wie gewohnt laden
            let power = await fetchFSAPI('netRemote.sys.power');
            currentPowerState = (power !== null) ? parseInt(power) : 0;
            updatePowerButtonUI();

            let vol = await fetchFSAPI('netRemote.sys.audio.volume');
            currentVolume = (vol !== null) ? parseInt(vol) : 0;
            document.getElementById('txt-volume').innerText = currentVolume;
            
            updateNowPlaying();
            loadDLNAList();
        } catch (e) { console.error("Fehler beim Laden des Start-Status:", e); }
    }
</script>

<!-- Block 3b: Power, Volume & Wiedergabe-Befehle (Mit Skip-Spurverfolgung) -->
<script>
    let userWantsPowerOn = false;

    function updatePowerButtonUI() {
        const btn = document.getElementById('btn-power');
        if (currentPowerState === 1) {
            btn.innerText = "Gerät ist AN (Ausschalten)";
            btn.className = "power-toggle power-on";
        } else {
            btn.innerText = "Gerät im STANDBY (Einschalten)";
            btn.className = "power-toggle power-off";
        }
    }

    async function togglePower() {
        const targetState = currentPowerState === 1 ? 0 : 1;
        const btn = document.getElementById('btn-power');
        
        btn.innerText = targetState === 1 ? "Wecke Hardware..." : "Schalte aus...";
        btn.className = "power-toggle"; 

        try {
            if (targetState === 1) {
                userWantsPowerOn = true;
                await setFSAPI('netRemote.sys.power', '1');
                await new Promise(r => setTimeout(r, 300));
                await setFSAPI('netRemote.play.control', '1');
                console.log("Weck-Impuls (Play) erfolgreich hinterhergeschickt.");
            } else {
                userWantsPowerOn = false;
                await setFSAPI('netRemote.play.control', '2');
                await new Promise(r => setTimeout(r, 200));
                await setFSAPI('netRemote.sys.power', '0');
            }

            await new Promise(r => setTimeout(r, 1200));

            let realPowerText = await fetchFSAPI('netRemote.sys.power');
            if (realPowerText !== null) {
                let apiPowerState = parseInt(realPowerText);
                if (apiPowerState === 1 && !userWantsPowerOn) {
                    currentPowerState = 0;
                } else {
                    currentPowerState = apiPowerState;
                }
            } else {
                currentPowerState = targetState;
            }
            
            updatePowerButtonUI();
            updateNowPlaying();
            
        } catch (e) {
            console.error("Fehler beim Schalten:", e);
            initStatus();
        }
    }

    async function changeVolume(delta) {
        let newVolume = currentVolume + delta;
        if (newVolume < 0) newVolume = 0; if (newVolume > 32) newVolume = 32;
        try {
            await setFSAPI('netRemote.sys.audio.volume', newVolume);
            currentVolume = newVolume;
            document.getElementById('txt-volume').innerText = currentVolume;
        } catch (e) {}
    }

    // KORRIGIERT: Fängt Skip-Befehle im Webinterface ab und rechnet den Index vorausschauend um
    async function sendControl(path, val) {
        try {
            // Wenn wir uns in einer Playlist befinden (confirmedIndex existiert)
            if (absoluteConfirmedIndex !== null && globalTotalTracks > 0) {
                if (val === '3') { 
                    // Wert '3' = Weiter (⏭) -> Erhöhe Index um 1 (solange wir nicht am Ende sind)
                    if (absoluteConfirmedIndex < globalTotalTracks - 1) {
                        absoluteConfirmedIndex = absoluteConfirmedIndex + 1;
                        possibleCandidateIndices = [absoluteConfirmedIndex];
                        console.log(`Skip-Forward gedrückt. Errechneter Ziel-Index: ${absoluteConfirmedIndex}`);
                    }
                } else if (val === '4') {
                    // Wert '4' = Zurück (⏮) -> Verringere Index um 1 (solange wir nicht am Anfang sind)
                    if (absoluteConfirmedIndex > 0) {
                        absoluteConfirmedIndex = absoluteConfirmedIndex - 1;
                        possibleCandidateIndices = [absoluteConfirmedIndex];
                        console.log(`Skip-Backward gedrückt. Errechneter Ziel-Index: ${absoluteConfirmedIndex}`);
                    }
                }
                
                // Sofort die visuelle Anzeige aktualisieren, bevor in 4s das träge Radio antwortet
                highlightCurrentTrackInList();
            }

            await setFSAPI(path, val);
            // Nach dem Skip dem Radio etwas Zeit geben, dann Daten abrufen
            setTimeout(updateNowPlaying, 800);
        } catch (e) {
            console.error("Fehler bei Steuerung:", e);
        }
    }
</script>

<!-- Block 3c: DLNA-Browser & Filter-Funktion -->
<script>
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // Klickpfad ab "Home" und zuletzt gespielter Titel. Damit kann die App die
    // Playlist neu ansteuern, wenn das Radio nach dem Einschalten nicht mehr
    // weiß, wo es war. Wird im localStorage gehalten, damit es einen Reload übersteht.
    function loadStored(key, fallback) {
        try {
            const v = localStorage.getItem(key);
            return v ? JSON.parse(v) : fallback;
        } catch (e) { return fallback; }
    }
    function store(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    let navPath = loadStored('blockradio.navPath', []);    // [{key, name}, ...]
    let lastTrack = loadStored('blockradio.lastTrack', null); // {index, name}

    // Statusanzeige im Listenfenster (ersetzt den Inhalt, bis die Liste neu geladen ist)
    function showListStatus(text, detail = "") {
        const listContainer = document.getElementById('dlna-browser-list');
        listContainer.innerHTML = "";
        const box = document.createElement('div');
        box.style.cssText = "font-size:0.8rem; color:#8e8e93; text-align:center; padding:10px;";
        const main = document.createElement('div');
        main.style.color = "#ffffff";
        main.innerText = text;
        box.appendChild(main);
        if (detail) {
            const sub = document.createElement('div');
            sub.style.marginTop = "4px";
            sub.innerText = detail;
            box.appendChild(sub);
        }
        listContainer.appendChild(box);
    }

    // Hinweiszeile oben über der (bereits geladenen) Liste
    function showListNotice(text) {
        const listContainer = document.getElementById('dlna-browser-list');
        const note = document.createElement('div');
        note.style.cssText = "font-size:0.8rem; color:#ff3b30; text-align:center; padding:8px; border-bottom:1px solid #3a3a3c;";
        note.innerText = text;
        listContainer.prepend(note);
    }

    // Liest das aktuelle Verzeichnis des Radios komplett ein (alle Seiten).
    // onProgress(anzahl) wird nach jeder geladenen Seite aufgerufen.
    async function fetchNavListItems(onProgress = null) {
        let allItems = [];
        let currentOffset = -1; 
        let hasMore = true;
        let loopSafety = 0;
        let blockedRetries = 0;
        let seenKeys = new Set();

        while (hasMore && loopSafety < 200) {
            loopSafety++;

            let response = await fetch(`http://${radioIP}/fsapi/LIST_GET_NEXT/netRemote.nav.list/${currentOffset}?pin=${pin}&maxItems=30`);
            let xmlText = await response.text();

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const status = xmlDoc.querySelector("status")?.textContent.trim();

            // Das Radio holt große Verzeichnisse blockweise (je 100 Einträge) vom
            // DLNA-Server nach. Während es nachlädt, meldet es FS_NODE_BLOCKED bzw.
            // FS_TIMEOUT – dann kurz warten und denselben Offset erneut anfragen.
            if (status === "FS_NODE_BLOCKED" || status === "FS_TIMEOUT") {
                if (++blockedRetries > 20) break;
                await new Promise(r => setTimeout(r, 500));
                continue;
            }
            blockedRetries = 0;

            const items = xmlDoc.querySelectorAll("item");

            if (items.length === 0) {
                hasMore = false;
                break;
            }

            let newItemsCount = 0;
            let lastValidKey = null;

            items.forEach(item => {
                const key = item.getAttribute("key");
                lastValidKey = key; 

                if (!seenKeys.has(key)) {
                    seenKeys.add(key);
                    allItems.push(item);
                    newItemsCount++;
                }
            });
            if (onProgress) onProgress(allItems.length);

            // Eine kurze Antwort (z.B. nur Keys 90–99) heißt NICHT, dass die Liste zu
            // Ende ist – das Radio liefert nur bis zur Grenze seines 100er-Puffers.
            // Echtes Ende wird über <listend/> signalisiert.
            const listEnd = xmlDoc.querySelector("listend") !== null;
            if (listEnd || newItemsCount === 0) {
                hasMore = false;
            } else if (lastValidKey !== null) {
                currentOffset = lastValidKey;
            }
        }
        return allItems;
    }

    function getItemName(item) {
        const nameNode = item.querySelector("field[name='name'] c8_array");
        const titleNode = item.querySelector("field[name='title'] c8_array");
        return titleNode ? titleNode.textContent : (nameNode ? nameNode.textContent : "");
    }

    async function loadDLNAList() {
        const listContainer = document.getElementById('dlna-browser-list');
        try {
            await setFSAPI('netRemote.nav.state', '1');
            
            const loadingText = restoringPlaylist ? "Playlist wird neu angesteuert..." : "Lade Liste...";
            showListStatus(loadingText);
            globalTotalTracks = 0; 
            
            // NEU: Suchfeld bei jedem echten Verzeichniswechsel automatisch leeren
            const searchInput = document.getElementById('input-dlna-search');
            if (searchInput) searchInput.value = "";

            const allItems = await fetchNavListItems(
                n => showListStatus(loadingText, `${n} Einträge geladen`));
            listContainer.innerHTML = "";

            if (allItems.length === 0) {
                listContainer.innerHTML = `<div style="font-size:0.8rem; color:#8e8e93; text-align:center; padding:10px;">Verzeichnis leer oder DLNA nicht aktiv.</div>`;
                return false;
            }

            let trackIndexCounter = 0;

            allItems.forEach(item => {
                const key = item.getAttribute("key");
                const name = getItemName(item);
                
                const typeNode = item.querySelector("field[name='type'] value, field[name='type'] u8");
                const subTypeNode = item.querySelector("field[name='subtype'] value, field[name='subtype'] u8");
                
                const typeVal = typeNode ? typeNode.textContent.trim() : "";
                const subTypeVal = subTypeNode ? subTypeNode.textContent.trim() : "";

                if (name.trim() === "" || name.toLowerCase() === "search") return;

                const isDirectory = (typeVal === "0" && subTypeVal === "0"); 

                const row = document.createElement('div');
                row.className = "dlna-item";
                
                let currentItemTrackIndex = null;
                if (!isDirectory) {
                    row.setAttribute("data-songname", name.trim().toLowerCase());
                    row.setAttribute("data-trackindex", trackIndexCounter);
                    row.setAttribute("data-key", key);
                    currentItemTrackIndex = trackIndexCounter;
                    trackIndexCounter++;
                }
                
                row.style.padding = "10px";
                row.style.borderBottom = "1px solid #3a3a3c";
                row.style.cursor = "pointer";
                row.style.fontSize = "0.85rem";
                row.style.color = "#ffffff";
                row.style.overflow = "hidden";
                row.style.textOverflow = "ellipsis";
                row.style.whiteSpace = "nowrap";
                
                row.innerText = isDirectory ? `📁 ${name}` : `🎵 ${name}`;
                
                row.onmouseenter = () => { if(!row.classList.contains('playing-now')) { row.style.backgroundColor = "#3a3a3c"; row.style.color = "#007aff"; } };
                row.onmouseleave = () => { if(!row.classList.contains('playing-now')) { row.style.backgroundColor = "transparent"; row.style.color = "#ffffff"; } };
                
                row.onclick = () => navigateDLNA(key, isDirectory, currentItemTrackIndex, name);
                listContainer.appendChild(row);
            });
            
            globalTotalTracks = trackIndexCounter;
            
            highlightCurrentTrackInList();
            return true;
        } catch (e) {
            listContainer.innerHTML = `<div style="font-size:0.8rem; color:#ff3b30; text-align:center; padding:10px;">Fehler beim Laden der DLNA-Liste.</div>`;
            return false;
        }
    }

    // NEU: Die Echtzeit-Filterfunktion für das Suchfeld
    function filterDLNAList() {
        const query = document.getElementById('input-dlna-search').value.trim().toLowerCase();
        const rows = document.querySelectorAll('.dlna-item');
        
        rows.forEach(row => {
            // Auslesen des angezeigten Textes (Ordnername oder Songname)
            const rowText = row.innerText.toLowerCase();
            
            if (rowText.includes(query)) {
                row.style.display = "block"; // Zeigen, wenn es passt
            } else {
                row.style.display = "none";  // Verbergen, wenn es nicht passt
            }
        });
    }

    async function resetDLNAHome() {
        navPath = [];
        store('blockradio.navPath', navPath);
        await setFSAPI('netRemote.nav.state', '0');
        await new Promise(r => setTimeout(r, 300));
        await setFSAPI('netRemote.nav.state', '1');
        await new Promise(r => setTimeout(r, 400));
        loadDLNAList();
    }

    // Fährt den gespeicherten Klickpfad ab "Home" erneut ab und startet den
    // zuletzt gespielten Titel. Ordner werden über den Namen gesucht, da sich
    // die Keys nach einem Neustart des Radios ändern können.
    let restoringPlaylist = false;
    async function restorePlaylistPosition() {
        if (restoringPlaylist || navPath.length === 0 || !lastTrack) return false;
        restoringPlaylist = true;
        const heading = "Playlist wird neu angesteuert...";
        showListStatus(heading, "Home");
        try {
            await setFSAPI('netRemote.nav.state', '0');
            await sleep(300);
            await setFSAPI('netRemote.nav.state', '1');
            await sleep(400);

            for (const [i, step] of navPath.entries()) {
                showListStatus(heading, `Ordner ${i + 1}/${navPath.length}: ${step.name}`);
                let items = [];
                for (let i = 0; i < 5 && items.length === 0; i++) {
                    items = await fetchNavListItems();
                    if (items.length === 0) await sleep(1000);
                }
                const byName = items.filter(it => getItemName(it).trim() === step.name.trim());
                const match = byName.find(it => it.getAttribute("key") === String(step.key)) || byName[0];
                if (!match) {
                    console.warn(`Ordner "${step.name}" nicht gefunden – Wiederherstellung abgebrochen.`);
                    restoringPlaylist = false;
                    await loadDLNAList();
                    showListNotice(`Ordner „${step.name}“ nicht gefunden – bitte neu auswählen.`);
                    return false;
                }
                step.key = match.getAttribute("key");
                console.log(`Wiederherstellung: öffne Ordner ${step.name}`);
                await setFSAPI('netRemote.nav.action.navigate', step.key);
                await sleep(1200);
            }
            store('blockradio.navPath', navPath);

            let loaded = await loadDLNAList();
            if (!loaded) { await sleep(1000); loaded = await loadDLNAList(); }
            if (!loaded) {
                showListStatus("Playlist konnte nicht geladen werden.");
                return false;
            }

            // Erst die gemerkte Position prüfen, sonst über den Namen suchen
            let row = document.querySelector(`.dlna-item[data-trackindex="${lastTrack.index}"]`);
            if (!row || row.getAttribute('data-songname') !== lastTrack.name) {
                row = document.querySelector(`.dlna-item[data-songname="${CSS.escape(lastTrack.name)}"]`);
            }
            if (!row) {
                console.warn(`Titel "${lastTrack.name}" nicht gefunden.`);
                showListNotice(`Titel „${lastTrack.name}“ nicht gefunden.`);
                return false;
            }
            const idx = parseInt(row.getAttribute('data-trackindex'));
            await navigateDLNA(row.getAttribute('data-key'), false, idx, row.getAttribute('data-songname'));
            return true;
        } finally {
            restoringPlaylist = false;
        }
    }

    // Play-Taste: erst normal abspielen; spielt das Radio danach nicht, den
    // Klickpfad neu abfahren. netRemote.play.status: 1 = Puffern, 2 = Spielt,
    // 4 = Nachpuffern; alles andere heißt, es läuft nichts.
    async function playWithRestore() {
        await setFSAPI('netRemote.play.control', '1');
        let status = null;
        for (let i = 0; i < 8; i++) {
            await sleep(500);
            status = parseInt(await fetchFSAPI('netRemote.play.status'));
            if (status === 2) break;
        }
        if (![1, 2, 4].includes(status)) {
            console.log(`Play ohne Wirkung (play.status=${status}) – steuere Playlist neu an.`);
            await restorePlaylistPosition();
        }
        updateNowPlaying();
    }

    async function navigateDLNA(key, isDirectory, trackIndex, songName) {
        if (key === 'back') {
            navPath.pop();
            store('blockradio.navPath', navPath);
            await setFSAPI('netRemote.nav.action.navigate', '-1');
            await new Promise(r => setTimeout(r, 400));
            loadDLNAList();
        } else if (isDirectory) {
            console.log(`Öffne Ordner: ${songName}`);
            navPath.push({ key: key, name: songName });
            store('blockradio.navPath', navPath);
            await setFSAPI('netRemote.nav.action.navigate', key);
            await new Promise(r => setTimeout(r, 1200));
            let success = await loadDLNAList();
            if (!success) {
                await new Promise(r => setTimeout(r, 1000));
                loadDLNAList();
            }
        } else {
            console.log(`Spiele Musikstück: ${songName} auf Index ${trackIndex}`);
            
            if (trackIndex !== null) {
                lastTrack = { index: parseInt(trackIndex), name: songName.trim().toLowerCase() };
                store('blockradio.lastTrack', lastTrack);
                absoluteConfirmedIndex = parseInt(trackIndex);
                possibleCandidateIndices = [absoluteConfirmedIndex];
                lastProcessedTitle = songName.trim();
            }
            
            await setFSAPI('netRemote.nav.action.selectItem', key);
            
            highlightCurrentTrackInList();
            setTimeout(updateNowPlaying, 1000);
        }
    }
</script>

<!-- Block 3d: Elastische Positions-Verifizierung (Teil 1) -->
<script>
    // Globale Variablen für deinen Spurverfolgungs-Algorithmus
    let absoluteConfirmedIndex = null; // Bestätigter, eindeutiger Song-Index (Ganzzahl)
    let possibleCandidateIndices = [];  // Array für unklare Indizes bei Doppelgängern
    let lastProcessedTitle = "";       // Speichert den Titel zur Erkennung eines Wechsels

    // Überprüft und visualisiert die Position auf Basis deines elastischen Abgleichs
    function highlightCurrentTrackInList() {
        const rows = document.querySelectorAll('.dlna-item');
        const trackNumEl = document.getElementById('info-tracknumber');
        const titleElement = document.getElementById('info-title');
        
        if (!titleElement) return;
        const playingTitle = titleElement.innerText.trim().toLowerCase();
        
        if (playingTitle === "" || playingTitle.includes("keine daten") || playingTitle.includes("keine medien")) return;

        let targetIndices = [];

        // Wenn wir eine mathematisch vermutete Position haben, validieren wir sie knallhart am echten Namen
        if (absoluteConfirmedIndex !== null) {
            const expectedRow = document.querySelector(`.dlna-item[data-trackindex="${absoluteConfirmedIndex}"]`);
            if (expectedRow) {
                const expectedSongName = expectedRow.getAttribute('data-songname');
                
                // KORREKTUR: Nur wenn der Name an der berechneten Stelle AUCH zum Live-Titel passt, nutzen wir ihn!
                if (expectedSongName && (expectedSongName.includes(playingTitle) || playingTitle.includes(expectedSongName))) {
                    targetIndices.push(absoluteConfirmedIndex);
                } else {
                    // Namenskonflikt! Der Index driftet ab. Wir loeschen den festen Index,
                    // damit Block 3e gezwungen wird, die Position namentlich neu zu suchen.
                    absoluteConfirmedIndex = null;
                }
            } else {
                absoluteConfirmedIndex = null;
            }
        } 

        // Fallback: Wenn der Index ungültig wurde oder unklar ist, markieren wir alle namentlich passenden Treffer
        if (absoluteConfirmedIndex === null) {
            rows.forEach(row => {
                const songNameAttr = row.getAttribute('data-songname');
                if (songNameAttr && (songNameAttr.includes(playingTitle) || playingTitle.includes(songNameAttr))) {
                    const idx = parseInt(row.getAttribute('data-trackindex'));
                    if (!targetIndices.includes(idx)) targetIndices.push(idx);
                }
            });
            // Falls wir im Schwebezustand exakt ein Match finden, loggen wir es direkt wieder fest ein!
            if (targetIndices.length === 1) {
                absoluteConfirmedIndex = targetIndices[0];
                possibleCandidateIndices = [absoluteConfirmedIndex];
            } else {
                possibleCandidateIndices = targetIndices;
            }
        }

        if (absoluteConfirmedIndex !== null) {
            const row = document.querySelector(`.dlna-item[data-trackindex="${absoluteConfirmedIndex}"]`);
            const name = row ? row.getAttribute('data-songname') : null;
            if (name && (!lastTrack || lastTrack.index !== absoluteConfirmedIndex || lastTrack.name !== name)) {
                lastTrack = { index: absoluteConfirmedIndex, name: name };
                store('blockradio.lastTrack', lastTrack);
            }
        }

        // UI-Aktualisierung der #/# Anzeige oben drüber
        if (absoluteConfirmedIndex !== null && globalTotalTracks > 0) {
            trackNumEl.innerText = `TRACK ${parseInt(absoluteConfirmedIndex) + 1}/${globalTotalTracks}`;
            trackNumEl.style.display = "block";
        } else if (globalTotalTracks > 0 && possibleCandidateIndices.length > 1) {
            trackNumEl.innerText = `TRACK (?)/${globalTotalTracks}`;
            trackNumEl.style.display = "block";
        } else {
            trackNumEl.style.display = "none";
        }

        // Visuelles Umfärben der Zeilen im Browser-Kasten
        rows.forEach(row => {
            const trackIndexAttr = row.getAttribute('data-trackindex');
            if (trackIndexAttr !== null) {
                const idx = parseInt(trackIndexAttr);
                
                if (targetIndices.includes(idx)) {
                    markRowAsPlaying(row);
                } else {
                    resetRowStyle(row);
                }
            }
        });
    }

    function markRowAsPlaying(row) {
        if (!row.classList.contains('playing-now')) {
            row.classList.add('playing-now');
            row.style.backgroundColor = "rgba(0, 122, 255, 0.25)";
            row.style.color = "#007aff";
            row.style.fontWeight = "bold";
            if (row.innerText.startsWith('🎵')) {
                row.innerText = row.innerText.replace('🎵', '▶');
            }
            if (absoluteConfirmedIndex !== null) {
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    }

    function resetRowStyle(row) {
        if (row.classList.contains('playing-now')) {
            row.classList.remove('playing-now');
            row.style.backgroundColor = "transparent";
            row.style.color = "#ffffff";
            row.style.fontWeight = "normal";
            row.innerText = row.innerText.replace('▶', '🎵');
        }
    }
</script>

<!-- Block 3e: Das korrigierte Live-Polling (Teil 2) -->
<script>
    async function updateNowPlaying() {
        const coverEl = document.getElementById('info-cover');
        const titleEl = document.getElementById('info-title');
        const artistEl = document.getElementById('info-artist');
        const albumEl = document.getElementById('info-album');
        const detailEl = document.getElementById('info-detail');
        
        try {
            const [trackName, artist, album, trackDetail, graphicUri] = await Promise.all([
                fetchFSAPI('netRemote.play.info.name'),
                fetchFSAPI('netRemote.play.info.artist'),
                fetchFSAPI('netRemote.play.info.album'),
                fetchFSAPI('netRemote.play.info.text'),
                fetchFSAPI('netRemote.play.info.graphicUri')
            ]);

            let cleanLiveTitle = (trackName && trackName.trim() !== "") ? trackName.trim() : "";
            if (cleanLiveTitle === "" && trackDetail && trackDetail.trim() !== "") {
                cleanLiveTitle = trackDetail.trim();
            }

            if (cleanLiveTitle !== "") {
                titleEl.innerText = cleanLiveTitle;
                artistEl.innerText = artist ? artist : "";
                albumEl.innerText = album ? album : "";
                detailEl.innerText = (trackDetail && trackDetail !== cleanLiveTitle) ? trackDetail : "";
            } else {
                titleEl.innerText = "Keine Medieninformationen";
                artistEl.innerText = ""; albumEl.innerText = ""; detailEl.innerText = "Gestoppt oder AUX";
                absoluteConfirmedIndex = null;
                possibleCandidateIndices = [];
            }

            if (graphicUri && graphicUri.trim() !== "") {
                coverEl.src = graphicUri.startsWith('/') ? `http://${radioIP}${graphicUri}` : graphicUri;
                coverEl.style.display = "block";
            } else { coverEl.style.display = "none"; }
            detailEl.style.display = detailEl.innerText ? "block" : "none";

            // KORREKTUR: Wenn ein fester Index da ist, pruefen wir erst, ob der Name dort noch stimmt
            if (absoluteConfirmedIndex !== null) {
                const expectedRow = document.querySelector(`.dlna-item[data-trackindex="${absoluteConfirmedIndex}"]`);
                if (expectedRow) {
                    const expectedSongName = expectedRow.getAttribute('data-songname');
                    
                    // Stimmt der berechnete Platz noch mit dem echten Gesang ueberein?
                    if (cleanLiveTitle !== "" && expectedSongName && (expectedSongName.includes(cleanLiveTitle.toLowerCase()) || cleanLiveTitle.toLowerCase().includes(expectedSongName))) {
                        // Ja, alles in bester Ordnung!
                        lastProcessedTitle = cleanLiveTitle;
                        highlightCurrentTrackInList();
                        return; 
                    } else {
                        // Konflikt! Das Radio singt was anderes. Wir loeschen den Index, damit unten neu gesucht wird
                        absoluteConfirmedIndex = null;
                    }
                }
            }

            // Normales Polling und Spur-Verfolgung bei automatischen Liedwechseln
            if (cleanLiveTitle !== "" && cleanLiveTitle.toLowerCase() !== lastProcessedTitle.toLowerCase()) {
                const currentTitleLower = cleanLiveTitle.toLowerCase();
                const rows = document.querySelectorAll('.dlna-item');
                
                let currentMatches = [];
                rows.forEach(row => {
                    const sName = row.getAttribute('data-songname');
                    if (sName && (sName.includes(currentTitleLower) || currentTitleLower.includes(sName))) {
                        currentMatches.push(parseInt(row.getAttribute('data-trackindex')));
                    }
                });

                if (lastProcessedTitle !== "" && possibleCandidateIndices.length > 0) {
                    let validNextCandidates = [];
                    
                    possibleCandidateIndices.forEach(oldIdx => {
                        let expectedNextIdx = parseInt(oldIdx) + 1;
                        if (currentMatches.includes(expectedNextIdx)) {
                            validNextCandidates.push(expectedNextIdx);
                        }
                    });

                    if (validNextCandidates.length === 1) {
                        absoluteConfirmedIndex = parseInt(validNextCandidates);
                        possibleCandidateIndices = [absoluteConfirmedIndex];
                    } else if (validNextCandidates.length > 1) {
                        absoluteConfirmedIndex = null;
                        possibleCandidateIndices = validNextCandidates;
                    } else {
                        absoluteConfirmedIndex = (currentMatches.length === 1) ? parseInt(currentMatches) : null;
                        possibleCandidateIndices = currentMatches;
                    }
                } else {
                    absoluteConfirmedIndex = (currentMatches.length === 1) ? parseInt(currentMatches) : null;
                    possibleCandidateIndices = currentMatches;
                }

                lastProcessedTitle = cleanLiveTitle;
            }

            highlightCurrentTrackInList();

        } catch (e) {
            titleEl.innerText = "Keine Verbindung";
            document.getElementById('info-tracknumber').style.display = "none";
        }
    }

    async function keepRadioAlive() {
        if (currentPowerState === 1) {
            const keepAliveEnabled = document.getElementById('chk-keepalive').checked;
            if (!keepAliveEnabled) return; 
            
            let playStatusRes = await fetchFSAPI('netRemote.play.status');
            if (playStatusRes !== null) {
                if (parseInt(playStatusRes) === 2) return; 
            }

            let liveVolRes = await fetchFSAPI('netRemote.sys.audio.volume');
            let livePosRes = await fetchFSAPI('netRemote.play.position');
            
            if (liveVolRes !== null && livePosRes !== null) {
                let liveVolume = parseInt(liveVolRes) || 0;
                let currentPosMs = parseInt(livePosRes) || 0;
                currentVolume = liveVolume;
                document.getElementById('txt-volume').innerText = currentVolume;

                await setFSAPI('netRemote.sys.audio.volume', 0);
                await new Promise(r => setTimeout(r, 200));

                if (currentPosMs > 1500) {
                    await setFSAPI('netRemote.play.position', currentPosMs - 1000);
                    await new Promise(r => setTimeout(r, 200));
                    await setFSAPI('netRemote.play.control', '1');
                    await new Promise(r => setTimeout(r, 1000));
                } else {
                    await setFSAPI('netRemote.play.control', '1');
                    await new Promise(r => setTimeout(r, 1000));
                    await setFSAPI('netRemote.play.position', 0);
                    await new Promise(r => setTimeout(r, 200));
                }

                await setFSAPI('netRemote.play.control', '2');
                await new Promise(r => setTimeout(r, 200));
                await setFSAPI('netRemote.sys.audio.volume', liveVolume);
            }
        }
    }

    window.onload = function() {
        initStatus();
        setTimeout(() => {
            setInterval(updateNowPlaying, 4000);
            updateNowPlaying();
        }, 4000);
        setInterval(keepRadioAlive, 600000);
    };
</script>
