info:
  name: SetAVTransportURI
  type: http
  seq: 3
  tags:
    - UPnP

http:
  method: POST
  url: "{{upnpBaseUrl}}/AVTransport/control"
  headers:
    - name: Content-Type
      value: text/xml; charset="utf-8"
    - name: SOAPACTION
      value: '"urn:schemas-upnp-org:service:AVTransport:1#SetAVTransportURI"'
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
          <u:SetAVTransportURI xmlns:u="urn:schemas-upnp-org:service:AVTransport:1"><InstanceID>0</InstanceID><CurrentURI>{{streamUrl}}</CurrentURI><CurrentURIMetaData></CurrentURIMetaData></u:SetAVTransportURI>
        </s:Body>
      </s:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Setzt die URL, die das Radio abspielen soll. Danach muss `Play` folgen.

  - `CurrentURI`: HTTP-URL eines Streams oder einer Datei in einem der Formate aus `GetProtocolInfo`. Vorbelegt mit der Environment-Variable `streamUrl`.
  - `CurrentURIMetaData`: optional, DIDL-Lite-XML mit Titel/Interpret (XML-escaped). Leer lassen geht auch.

  Sonderzeichen in der URL (vor allem `&`) müssen im SOAP-Body als `&amp;` geschrieben werden.

  Wechselt das Radio in den DMR-Modus (`{{mode.UPNP_Stream}}`).

  <br/>

  Getestet am BLOCK SR200 MKII (2026-10-09): nicht ausgeführt (würde die laufende Wiedergabe umschalten)
