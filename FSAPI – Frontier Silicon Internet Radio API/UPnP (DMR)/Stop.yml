info:
  name: Stop
  type: http
  seq: 7
  tags:
    - UPnP

http:
  method: POST
  url: "{{upnpBaseUrl}}/AVTransport/control"
  headers:
    - name: Content-Type
      value: text/xml; charset="utf-8"
    - name: SOAPACTION
      value: '"urn:schemas-upnp-org:service:AVTransport:1#Stop"'
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
          <u:Stop xmlns:u="urn:schemas-upnp-org:service:AVTransport:1"><InstanceID>0</InstanceID></u:Stop>
        </s:Body>
      </s:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Stoppt die Wiedergabe (Zustand `STOPPED`).

  <br/>

  Getestet am BLOCK SR200 MKII (2026-10-09): nicht ausgeführt
