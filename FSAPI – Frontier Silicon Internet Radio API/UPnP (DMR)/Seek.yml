info:
  name: Seek
  type: http
  seq: 8
  tags:
    - UPnP

http:
  method: POST
  url: "{{upnpBaseUrl}}/AVTransport/control"
  headers:
    - name: Content-Type
      value: text/xml; charset="utf-8"
    - name: SOAPACTION
      value: '"urn:schemas-upnp-org:service:AVTransport:1#Seek"'
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
          <u:Seek xmlns:u="urn:schemas-upnp-org:service:AVTransport:1"><InstanceID>0</InstanceID><Unit>REL_TIME</Unit><Target>00:01:00</Target></u:Seek>
        </s:Body>
      </s:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Springt innerhalb des aktuellen Titels.

  - `Unit`: `REL_TIME` (Zeitposition, `Target` als `hh:mm:ss`) oder `TRACK_NR`.

  Bei Live-Streams wirkungslos.

  <br/>

  Getestet am BLOCK SR200 MKII (2026-10-09): nicht ausgeführt
