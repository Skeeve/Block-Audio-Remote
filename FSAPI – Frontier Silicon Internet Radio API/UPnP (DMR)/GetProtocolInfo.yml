info:
  name: GetProtocolInfo
  type: http
  seq: 2
  tags:
    - UPnP

http:
  method: POST
  url: "{{upnpBaseUrl}}/ConnectionManager/control"
  headers:
    - name: Content-Type
      value: text/xml; charset="utf-8"
    - name: SOAPACTION
      value: '"urn:schemas-upnp-org:service:ConnectionManager:1#GetProtocolInfo"'
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
          <u:GetProtocolInfo xmlns:u="urn:schemas-upnp-org:service:ConnectionManager:1"></u:GetProtocolInfo>
        </s:Body>
      </s:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liefert im Feld `Sink` die Audioformate, die das Radio als Renderer annimmt (kommagetrennte `protocolInfo`-Einträge).

  Laut Radio: MP3 (`audio/mpeg`), AAC/M4A (`audio/mp4`, `audio/x-aac`, `audio/3gpp`, ...), FLAC, WAV, WMA, rohes PCM (`audio/L16`, `audio/L8`, 8–48 kHz). Ogg/Vorbis, Opus und HLS werden nicht genannt.

  <br/>

  Getestet am BLOCK SR200 MKII (2026-10-09): HTTP 200, 53 Format-Einträge
