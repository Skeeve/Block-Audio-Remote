info:
  name: SetNextAVTransportURI
  type: http
  seq: 4
  tags:
    - UPnP

http:
  method: POST
  url: "{{upnpBaseUrl}}/AVTransport/control"
  headers:
    - name: Content-Type
      value: text/xml; charset="utf-8"
    - name: SOAPACTION
      value: '"urn:schemas-upnp-org:service:AVTransport:1#SetNextAVTransportURI"'
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
          <u:SetNextAVTransportURI xmlns:u="urn:schemas-upnp-org:service:AVTransport:1"><InstanceID>0</InstanceID><NextURI>{{streamUrl}}</NextURI><NextURIMetaData></NextURIMetaData></u:SetNextAVTransportURI>
        </s:Body>
      </s:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Merkt die URL für den nächsten Titel vor, damit er ohne Lücke an den aktuellen anschließt. Die Warteschlange fasst nur diesen einen Titel; Playlists muss der Absender selbst verwalten.

  <br/>

  Getestet am BLOCK SR200 MKII (2026-10-09): nicht ausgeführt
