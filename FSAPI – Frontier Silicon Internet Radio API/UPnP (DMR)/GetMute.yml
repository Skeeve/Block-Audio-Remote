info:
  name: GetMute
  type: http
  seq: 14
  tags:
    - UPnP

http:
  method: POST
  url: "{{upnpBaseUrl}}/RenderingControl/control"
  headers:
    - name: Content-Type
      value: text/xml; charset="utf-8"
    - name: SOAPACTION
      value: '"urn:schemas-upnp-org:service:RenderingControl:1#GetMute"'
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
          <u:GetMute xmlns:u="urn:schemas-upnp-org:service:RenderingControl:1"><InstanceID>0</InstanceID><Channel>Master</Channel></u:GetMute>
        </s:Body>
      </s:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Liest den Stummschalt-Zustand (`CurrentMute` 0/1).

  <br/>

  Getestet am BLOCK SR200 MKII (2026-10-09): HTTP 200, `CurrentMute` 0
