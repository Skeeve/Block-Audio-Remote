  type: http
  seq: 14
  tags:
    - Multiroom

http:
  method: GET
  url: "{{baseUrl}}/fsapi/SET/netRemote.multiroom.group.addClient?pin={{pin}}"
  params:
    - name: pin
      value: "{{pin}}"
      type: query
      description: Device PIN used to authenticate the request.
    - name: value
      value: ""
      type: query
      description: New value to assign (unknown).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

