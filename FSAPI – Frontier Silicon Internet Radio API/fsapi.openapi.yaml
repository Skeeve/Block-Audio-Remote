openapi: 3.0.3
info:
  title: FSAPI – Frontier Silicon Internet Radio API
  description: 'OpenAPI description of the Frontier Silicon FSAPI, covering session handling (CREATE_SESSION,
    DELETE_SESSION, GET_NOTIFIES) and the full node reference (Navigation, Playback, System, Platform,
    Misc/Debug, Test, Spotify, AirPlay, Multiroom), as documented at https://ex-frontier.hexdocs.pm/fsapi.html.


    Authentication: every request accepts the device PIN as the `pin` query parameter. A session (`sid`,
    obtained once from CREATE_SESSION) is an alternative to sending the PIN on every call, but is optional
    — all node operations below are modeled using `pin` directly for simplicity, since a device only keeps
    one session active at a time anyway and re-sending the PIN avoids session-invalidation issues entirely.


    Node coverage note: many nodes (especially under System, Spotify, AirPlay, Test, Misc and Platform)
    are marked as undocumented/TODO in the upstream reference itself — those are still included here (as
    GET operations) but flagged in their description so you know the access mode is a best guess, not
    confirmed. Nodes documented as list-type are exposed via LIST_GET_NEXT instead of GET. Indexed multiroom
    client nodes (originally suffixed `X` in the docs) are modeled with a path parameter instead.'
  version: 2.0.0
  contact:
    name: FSAPI reference
    url: https://ex-frontier.hexdocs.pm/fsapi.html
externalDocs:
  description: Original FSAPI documentation (fsapi Elixir library)
  url: https://ex-frontier.hexdocs.pm/fsapi.html
servers:
- url: http://{deviceHost}
  description: The internet radio / FSAPI device on the local network.
  variables:
    deviceHost:
      default: 192.168.1.100
      description: IP address or hostname of the FSAPI device.
tags:
- name: Session
  description: Create/destroy a session and watch for push notifications.
- name: Generic Node Access
  description: Untyped GET/SET/LIST_GET_NEXT for any node path, including ones not covered below.
- name: Navigation
  description: netRemote.nav.* nodes.
- name: Playback
  description: netRemote.play.* nodes.
- name: System
  description: netRemote.sys.* nodes.
- name: Platform
  description: netRemote.platform.* nodes.
- name: Misc / Debug
  description: netRemote.misc.* nodes.
- name: Test
  description: netRemote.test.* nodes.
- name: Spotify
  description: Only available on devices with Spotify support. netRemote.spotify.* nodes.
- name: AirPlay
  description: Only available on devices with AirPlay support. netRemote.airplay.* nodes.
- name: Multiroom
  description: netRemote.multiroom.* nodes.
paths:
  /fsapi/CREATE_SESSION:
    get:
      operationId: createSession
      tags:
      - Session
      summary: Log in and obtain a Session-ID
      description: Authenticates with the device PIN and returns a new `sessionId` (`sid`). Creating a
        session invalidates any session previously issued by this or another client, since the device
        supports only one active session at a time. Not required for any of the node requests below, which
        authenticate with `pin` directly.
      parameters:
      - $ref: '#/components/parameters/pin'
      responses:
        '200':
          description: Request reached a valid path with a correct PIN. Check `<status>` for the actual
            outcome.
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '403':
          description: Forbidden – PIN is missing or incorrect.
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/FsapiResponse'
        '404':
          description: Not Found – invalid path.
  /fsapi/DELETE_SESSION:
    get:
      operationId: deleteSession
      tags:
      - Session
      summary: Log out and invalidate a Session-ID
      description: Destroys the given session so its `sid` can no longer be used.
      parameters:
      - $ref: '#/components/parameters/sid'
      responses:
        '200':
          description: Session deleted (or status explains why not).
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/FsapiResponse'
        '404':
          description: Not Found – `sid` is unknown/invalid or path is invalid.
  /fsapi/GET_NOTIFIES:
    get:
      operationId: getNotifies
      tags:
      - Session
      summary: Long-poll for server-pushed node change notifications
      description: Requires a valid, previously created `sid` (this is the one operation where a session
        is actually necessary, since there is no PIN-only equivalent). The connection is kept open by
        the device so it can push notifications about node value changes as they occur.
      parameters:
      - $ref: '#/components/parameters/sid'
      responses:
        '200':
          description: One or more node-change notifications, or a timeout status.
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/NotifyResponse'
        '404':
          description: Not Found – `sid` is missing/invalid or path is invalid.
  /fsapi/GET/{node}:
    get:
      operationId: getNodeGeneric
      tags:
      - Generic Node Access
      summary: Read the value of an arbitrary node
      description: Generic fallback for any node not covered by the category-specific requests below.
      parameters:
      - $ref: '#/components/parameters/node'
      - $ref: '#/components/parameters/pin'
      responses:
        '200':
          description: Node value returned (see status for the outcome).
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/GetResponse'
        '403':
          description: Forbidden – PIN missing or incorrect.
        '404':
          description: Not Found – unknown node or invalid path.
  /fsapi/SET/{node}:
    get:
      operationId: setNodeGeneric
      tags:
      - Generic Node Access
      summary: Write the value of an arbitrary node
      description: Generic fallback for any node not covered by the category-specific requests below.
      parameters:
      - $ref: '#/components/parameters/node'
      - $ref: '#/components/parameters/pin'
      - name: value
        in: query
        required: true
        description: New value to assign to the node.
        schema:
          type: string
      responses:
        '200':
          description: Write attempted; check status (FS_OK, FS_FAIL, FS_PACKET_BAD, FS_NODE_BLOCKED,
            ...).
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/FsapiResponse'
        '403':
          description: Forbidden – PIN missing or incorrect.
        '404':
          description: Not Found – unknown node or invalid path.
  /fsapi/LIST_GET_NEXT/{node}/{index}:
    get:
      operationId: listGetNextGeneric
      tags:
      - Generic Node Access
      summary: Fetch the next page of an arbitrary list-type node
      description: Generic fallback for any list node not covered by the category-specific requests below.
      parameters:
      - $ref: '#/components/parameters/node'
      - name: index
        in: path
        required: true
        description: Zero-based index to continue listing after (-1 to start from the beginning).
        schema:
          type: integer
      - $ref: '#/components/parameters/pin'
      - name: maxItems
        in: query
        required: true
        description: Maximum number of list entries to return in this page.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: A page of list entries.
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ListGetNextResponse'
        '403':
          description: Forbidden – PIN missing or incorrect.
        '404':
          description: Not Found – unknown node or invalid path.
