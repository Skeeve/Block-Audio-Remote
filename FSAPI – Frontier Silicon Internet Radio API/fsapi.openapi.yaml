components:
  securitySchemes:
    pinAuth:
      type: apiKey
      in: query
      name: pin
      description: Device PIN, sent on every request.
    sessionAuth:
      type: apiKey
      in: query
      name: sid
      description: Session-ID previously obtained from CREATE_SESSION. Only needed for GET_NOTIFIES.
  parameters:
    pin:
      name: pin
      in: query
      required: true
      description: Device PIN used to authenticate the request.
      schema:
        type: string
    sid:
      name: sid
      in: query
      required: true
      description: Active Session-ID obtained from CREATE_SESSION.
      schema:
        type: string
    node:
      name: node
      in: path
      required: true
      description: Dotted FSAPI node path identifying the value to read/write, e.g. `netRemote.sys.info.friendlyName`.
      schema:
        type: string
  schemas:
    Status:
      type: string
      description: Outcome of an FSAPI request.
      enum:
      - FS_OK
      - FS_FAIL
      - FS_PACKET_BAD
      - FS_NODE_BLOCKED
      - FS_NODE_DOES_NOT_EXIST
      - FS_TIMEOUT
      - FS_LIST_END
      x-enum-descriptions:
        FS_OK: Command executed successfully; value is valid.
        FS_FAIL: Supplied value does not satisfy the node's validation rules.
        FS_PACKET_BAD: SET attempted on a read-only node.
        FS_NODE_BLOCKED: SET attempted on a node that is inactive for the current operation mode.
        FS_NODE_DOES_NOT_EXIST: The requested node does not exist.
        FS_TIMEOUT: The request exceeded the allowed duration.
        FS_LIST_END: No further entries remain in the list.
    FsapiResponse:
      type: object
      description: Common envelope returned by every FSAPI call.
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
      - status
    CreateSessionResponse:
      allOf:
      - $ref: '#/components/schemas/FsapiResponse'
      - type: object
        properties:
          sessionId:
            type: string
            description: Newly issued Session-ID.
        required:
        - sessionId
    NodeValue:
      type: object
      description: Typed scalar value as returned by GET/SET/list fields. Exactly one of the typed properties
        is present, matching the node's declared FSAPI type.
      properties:
        u8:
          type: integer
          description: Unsigned 8-bit integer value.
        u16:
          type: integer
          description: Unsigned 16-bit integer value.
        u32:
          type: integer
          description: Unsigned 32-bit integer value.
        s8:
          type: integer
          description: Signed 8-bit integer value.
        s16:
          type: integer
          description: Signed 16-bit integer value.
        s32:
          type: integer
          description: Signed 32-bit integer value.
        e8:
          type: integer
          description: Enumerated value (index into the node's enum table).
        c8_array:
          type: string
          description: UTF-8 string / binary-as-text value.
    GetResponse:
      allOf:
      - $ref: '#/components/schemas/FsapiResponse'
      - type: object
        properties:
          value:
            $ref: '#/components/schemas/NodeValue'
    ListItemField:
      type: object
      properties:
        name:
          type: string
          description: Field name within the list item (e.g. "name", "key").
        value:
          $ref: '#/components/schemas/NodeValue'
    ListItem:
      type: object
      properties:
        key:
          type: string
          description: Index/key of this item within the list.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ListItemField'
    ListGetNextResponse:
      allOf:
      - $ref: '#/components/schemas/FsapiResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ListItem'
          listend:
            type: boolean
            description: True once the end of the list has been reached.
    NotifyResponse:
      allOf:
      - $ref: '#/components/schemas/FsapiResponse'
      - type: object
        properties:
          notifications:
            type: array
            description: Nodes whose value changed since the last poll.
            items:
              type: object
              properties:
                node:
                  type: string
                  description: Dotted node path that changed.
                value:
                  $ref: '#/components/schemas/NodeValue'
