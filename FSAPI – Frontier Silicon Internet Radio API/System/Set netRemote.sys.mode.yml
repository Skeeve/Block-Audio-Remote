info:
  name: Set netRemote.sys.mode
  type: http
  seq: 70
  tags:
    - System

http:
  method: GET
  url: "{{baseUrl}}/fsapi/SET/netRemote.sys.mode?pin={{pin}}&value={{mode.Musik_abspielen}}"
  params:
    - name: pin
      value: "{{pin}}"
      type: query
      description: Device PIN used to authenticate the request.
    - name: value
      value: "{{mode.Musik_abspielen}}"
      type: query
      description: New value to assign (u32).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Write attempted; check status (FS_OK, FS_FAIL, FS_PACKET_BAD, FS_NODE_BLOCKED, ...).
    request:
      url: "{{baseUrl}}/fsapi/SET/netRemote.sys.mode"
      method: GET
      params:
        - name: pin
          value: ""
          type: query
          description: Device PIN used to authenticate the request.
        - name: value
          value: ""
          type: query
          description: New value to assign (u32).
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/xml
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <status>FS_OK</status>
          </root>
  - name: 403 Response
    description: Forbidden – PIN missing or incorrect.
    request:
      url: "{{baseUrl}}/fsapi/SET/netRemote.sys.mode"
      method: GET
      params:
        - name: pin
          value: ""
          type: query
          description: Device PIN used to authenticate the request.
        - name: value
          value: ""
          type: query
          description: New value to assign (u32).
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Not Found – unknown node or invalid path.
    request:
      url: "{{baseUrl}}/fsapi/SET/netRemote.sys.mode"
      method: GET
      params:
        - name: pin
          value: ""
          type: query
          description: Device PIN used to authenticate the request.
        - name: value
          value: ""
          type: query
          description: New value to assign (u32).
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Current operation mode (IR, DAB, FM, Spotify, ...).
